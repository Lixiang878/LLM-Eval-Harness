[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "轻量大模型评测框架：多模型对比、LLM-as-Judge 自动打分与 Bad Case 归因"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "李想" }]
keywords = ["llm", "evaluation", "benchmark", "llm-as-judge", "testing", "qa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
api = ["requests>=2.28"]
chart = ["matplotlib>=3.5"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
llm-eval-harness = "llm_eval_harness.cli:main"

[project.urls]
Homepage = "https://github.com/Lixiang878/llm-eval-harness"
Repository = "https://github.com/Lixiang878/llm-eval-harness"
Issues = "https://github.com/Lixiang878/llm-eval-harness/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
