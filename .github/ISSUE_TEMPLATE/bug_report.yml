name: Bug report
description: 报告一个可复现的问题
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请提供可复现的信息，便于我们快速定位。
  - type: textarea
    id: what-happened
    attributes:
      label: 现象描述
      description: 实际发生了什么？你期望的行为是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 一步一步如何触发该问题？
      placeholder: |
        1. 运行命令：llm-eval-harness run ...
        2. 传入参数：...
        3. 观察到错误：...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: Python 版本、操作系统、运行模式（离线 mock / 真实模型）
      placeholder: |
        - Python: 3.11
        - OS: Windows 11 / Ubuntu 22.04
        - 模式: offline mock
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错
      render: shell
